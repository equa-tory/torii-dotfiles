# generated by torii-theme, do not edit (Disk usage app: gdu --config-file this)
style:
    footer:
        text-color: '{{accentFg}}'
        background-color: '{{accent}}'
        number-color: '{{accentFg}}'
    selected-row:
        text-color: '{{accentFg}}'
        background-color: '{{accent}}'
    marked:
        text-color: '{{bg}}'
        background-color: '{{red}}'
    result-row:
        number-color: '{{yellow}}'
        directory-color: '{{accent}}'
    header:
        text-color: '{{accentFg}}'
        background-color: '{{accent}}'
        hidden: false
    use-old-size-bar: false
    show-bar-percentage: true
    show-item-count-bar: false
# the whole system including /home (even when it is a separate drive or subvolume), but not the big data drives and
# network shares mounted under /mnt, /media and /run/media: open those from inside when you want them
no-cross: false
ignore-dirs:
    - /proc
    - /dev
    - /sys
    - /run
#    - /mnt
    - /mnt/@
    - /mnt/umbrel
    - /mnt/mass
    - /mnt/media
    - /media
show-relative-size: true
show-item-count: true
