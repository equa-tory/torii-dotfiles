# Bluetooth headphones (AirPods Max) stay in the high-quality profile (A2DP). By default WirePlumber switches them to the
# headset profile as soon as anything wants a microphone, which makes the sound much worse. The computer's own mic is used instead.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.use-persistent-storage = false
}
