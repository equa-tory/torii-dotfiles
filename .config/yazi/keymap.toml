# Extra keys for yazi (the defaults stay).
#   U        scan the sizes of the folders here: sorts by size, biggest first (folders show no size until you do), `,n` sorts back
#   g u      disk usage of this folder in gdu (torii-gdu: reads an NTFS drive in seconds, skips network shares)
[mgr]
prepend_keymap = [
  { on = "U", run = [ "sort size --reverse=yes", "linemode size" ], desc = "Scan folder sizes (biggest first)" },
  { on = [ "g", "u" ], run = 'shell --block -- torii-gdu "$PWD"', desc = "Disk usage of this folder (gdu)" },
]
