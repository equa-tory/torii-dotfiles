# yazi: arrows (or h j k l) move around, Left = parent folder, Right / Enter = open the folder or the file.
# Files open through torii-open (the same apps as `open`, Dolphin and mc: Setup > Defaults > Open files with): Enter / o. Text opens
# in nvim right here in yazi (the opener blocks); windows apps (mpv, imv, zathura ...) start on their own.
[mgr]
show_hidden = false
sort_dir_first = true
linemode = "size"

[opener]
torii = [
  { run = 'torii-open "$@"', desc = "Open", for = "unix", block = true },
]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", for = "unix", block = true },
]

[open]
rules = [
  { url = "*/", use = ["torii"] },
  { mime = "*", use = ["torii", "edit"] },
]

