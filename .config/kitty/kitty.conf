shell /usr/bin/zsh

background_opacity 0.6
dynamic_background_opacity no

# Vibrant dark background
background #101019
foreground #e8e8f2

# Cursor
cursor #00ffdd
cursor_text_color #101019

# Selection
selection_background #49406a
selection_foreground #ffffff

# Vibrant ANSI colors
color0  #191926
color1  #ff5370
color2  #c3e88d
color3  #ffcb6b
color4  #82aaff
color5  #c792ea
color6  #89ddff
color7  #eeffff
color8  #676e95
color9  #ff5370
color10 #c3e88d
color11 #ffcb6b
color12 #82aaff
color13 #c792ea
color14 #89ddff
color15 #ffffff

# torii-theme overrides the colours above (a missing file is fine)
include ~/.local/state/torii/theme/kitty.conf
